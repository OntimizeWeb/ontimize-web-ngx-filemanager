name: Sonar

concurrency:
  group: sonar-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NEXUS_REGISTRY: https://nexus.imatia.com/repository/npm-group/

on:
  push:
    branches:
      - main.15.x
      - 15.x.x
      - hotfix/15.*
  pull_request:
    types: [opened, synchronize, reopened, labeled]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: 'Cache node modules'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Node 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.10.0

      - name: Setup Node registry
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'snapshot')
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_NEXUS_AUTH_TOKEN }}
        run: |
          npm set registry=${{ env.NEXUS_REGISTRY }}
          npm set _auth=$NPM_AUTH_TOKEN

      - name: npm install and npm run test-ci
        run: |
          npm i
          npm run test-ci

      - name: coverage .lcov workaround
        run: |
          sed -i 's+/home/runner/work/ontimize-web-ngx-filemanager/ontimize-web-ngx-filemanager+/github/workspace+g' coverage/ontimize-web-ngx-filemanager/lcov.info

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
